upstream backend {
    server backend:8080;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Inherited by every location below, as long as none of them sets its own
    # add_header (cache headers use `expires` for that reason).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json application/yaml image/svg+xml;

    # API, health check and API docs go to the Go backend. X-Request-ID from
    # the client is forwarded as is; the backend generates one when missing.
    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
    }

    location = /healthz {
        proxy_pass http://backend;
    }

    location /swagger {
        proxy_pass http://backend;
    }

    # Vite puts a content hash in asset file names, so they can be cached forever.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # SPA: unknown paths serve index.html, which is always revalidated.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
