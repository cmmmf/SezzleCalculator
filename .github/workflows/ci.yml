name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: go vet
        run: go vet ./...
      - name: Test with race detector and coverage
        run: go test ./... -race -coverprofile=coverage.out
      - name: Coverage report
        run: |
          go tool cover -func=coverage.out | tail -n 1
          go tool cover -html=coverage.out -o coverage.html
      - uses: actions/upload-artifact@v5
        with:
          name: backend-coverage
          path: backend/coverage.html

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Test with coverage
        run: npm run coverage
      - name: Build
        run: npm run build
      - uses: actions/upload-artifact@v5
        with:
          name: frontend-coverage
          path: frontend/coverage

  docker:
    name: Docker images + smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - name: Build images
        run: docker compose build
      - name: Start the stack
        run: docker compose up -d --wait
      - name: Smoke test through nginx
        run: |
          curl -fsS http://localhost:8080/ | grep -q '<title>Calculator</title>'
          curl -fsS http://localhost:8080/healthz
          curl -fsS -X POST http://localhost:8080/api/v1/divide \
            -H 'Content-Type: application/json' -d '{"a":10,"b":4}' | grep -q '"result":2.5'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8080/api/v1/divide \
            -H 'Content-Type: application/json' -d '{"a":1,"b":0}')" = 422
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop the stack
        if: always()
        run: docker compose down
